name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install tooling
        run: npm ci
      - name: Build plugins
        run: npm run build
      - name: Check plugin layout
        run: npm run check
      - name: Run plugin tests
        run: npm test
      - name: Check template
        run: |
          npm --prefix templates/plugin run build
          npm --prefix templates/plugin test
